<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Me Assume?</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to bottom right, #ff99cc, #ffe6f0);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    h1 {
      color: #d6336c;
      text-align: center;
      padding: 0 20px;
    }

    .buttons {
      position: relative;
      width: 100%;
      height: 200px;
      margin-top: 30px;
    }

    button {
      font-size: 20px;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      position: absolute;
    }

    #yesBtn {
      background-color: #ff4d88;
      color: white;
      left: 25%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #noBtn {
      background-color: #cccccc;
      color: black;
      top: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <h1>Você vai me assumir ou vai continuar fugindo do amor?</h1>
  <div class="buttons">
    <button id="yesBtn" onclick="alert('tambem te amo 😍.')">SIM</button>
    <button id="noBtn">NÃO</button>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    let direction = 1;
    let position = 75;

    function animateNoButton() {
      const screenWidth = window.innerWidth;
      position += direction * 2;

      if (position > screenWidth - 50 || position < 50) {
        direction *= -1;
      }

      noBtn.style.left = `${position}px`;
      requestAnimationFrame(animateNoButton);
    }

    animateNoButton();
  </script>
</body>
</html>
